name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Copy Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/
          cp -r css android/app/src/main/assets/
          cp -r js android/app/src/main/assets/
          cp -r icons android/app/src/main/assets/

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew || true

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HVAC-Engineering-Tools.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HVAC-Engineering-Tools-APK
          path: HVAC-Engineering-Tools.apk

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "HVAC 空調工程小工具 最新手機 APK 安裝檔"
          body: "點擊下方 `HVAC-Engineering-Tools.apk` 即可下載安裝至 Android 手機上使用。"
          files: HVAC-Engineering-Tools.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
